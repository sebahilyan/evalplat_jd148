[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sebahilyan-evalplat_jd148"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告模型评测平台工程师·冷启动与模型加载时间相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sebahilyan" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sebahilyan.github.io"
Repository = "https://github.com/sebahilyan/evalplat_jd148"
Issues = "https://github.com/sebahilyan/evalplat_jd148/issues"

[project.scripts]
evalplat_jd148 = "evalplat_jd148:main"

[tool.setuptools]
py-modules = ["evalplat_jd148"]
